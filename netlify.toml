# All files sit in the repository root: the site is published from the root,
# and submit.mjs / results.mjs in the root are the server functions.
[build]
  publish = "."
  functions = "."

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
